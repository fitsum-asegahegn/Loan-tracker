<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fitsum's Debt Tracker</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" href="./icon-192.png" />
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .login-card { margin-top: 15vh; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-style: italic; margin-top: 0; }
  form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; color: var(--muted); }
  input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0b1220;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #05170c;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 0.85rem; }
  .info { color: var(--accent); font-size: 0.85rem; }
  .link-btn {
    background: transparent;
    border: none;
    color: var(--accent);
    font-weight: 400;
    font-size: 0.85rem;
    text-decoration: underline;
    padding: 8px;
  }
  .role-picker { display: flex; flex-direction: column; gap: 6px; }
  .role-label { font-size: 0.9rem; color: var(--muted); }
  .role-buttons { display: flex; gap: 8px; }
  .role-btn {
    flex: 1;
    background: #0b1220;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 500;
    font-size: 0.85rem;
    padding: 10px 6px;
  }
  .role-btn.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: #0b1e14;
  }
  .lang-toggle, .signout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 400;
    padding: 8px 12px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .topbar-actions { display: flex; gap: 8px; }
  .loan-header { display: flex; justify-content: space-between; font-weight: 600; }
  .principal { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .note { font-style: italic; color: var(--muted); }
  .balances { display: flex; gap: 12px; margin: 12px 0; }
  .balance-box {
    flex: 1;
    background: #0b1220;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .mode-label { font-size: 0.75rem; color: var(--muted); }
  .balance-amount { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
  .clause {
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    margin-top: 8px;
    font-size: 0.85rem;
  }
  .clause p { margin: 4px 0; }
  .clause .status { font-weight: 600; }
  .clause-forgiven .status { color: var(--accent); }
  .clause-expired .status { color: var(--danger); }
  .countdown-box {
    text-align: center;
    background: #0b1220;
    border-radius: 10px;
    padding: 12px 8px;
    margin: 8px 0;
  }
  .countdown-number {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .countdown-unit {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 4px 0 1px;
  }
  .countdown-flavor {
    margin-top: 4px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .marry-btn { margin-top: 10px; width: 100%; }
  .loan-card.forgiven { opacity: 0.6; }
  .empty { text-align: center; color: var(--muted); }
  .collapsible-header {
    width: 100%;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    text-align: left;
  }
  .collapsible-header h2 { margin: 0; }
  .chevron {
    font-size: 1.2rem;
    color: var(--muted);
    transition: transform 0.15s ease;
    transform: rotate(-90deg);
  }
  .chevron.open { transform: rotate(0deg); }
  .collapsible-body { margin-top: 12px; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
